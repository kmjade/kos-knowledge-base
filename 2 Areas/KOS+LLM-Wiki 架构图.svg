<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 1000">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap');
      text { font-family: 'Noto Sans SC', 'JetBrains Mono', 'PingFang SC', sans-serif; }
      .title { font-size: 17px; font-weight: 700; fill: #f1f5f9; }
      .layer-label { font-size: 11px; font-weight: 600; }
      .comp-title { font-size: 11px; font-weight: 600; fill: #e2e8f0; }
      .comp-sub { font-size: 8px; font-weight: 400; fill: #94a3b8; }
      .rel-text { font-size: 9px; font-weight: 500; fill: #cbd5e1; }
      .badge { font-size: 8px; font-weight: 600; }
      .std-text { font-size: 9px; font-weight: 500; fill: #cbd5e1; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-up" markerWidth="10" markerHeight="7" refX="5" refY="7" orient="auto">
      <polygon points="0,7 5,0 10,7" fill="#64748b"/>
    </marker>
    <marker id="arrow-right" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0,0 10,3.5 0,7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1150" height="1000" fill="#0f172a"/>
  <rect width="1150" height="1000" fill="url(#grid)"/>

  <!-- Title -->
  <text x="575" y="28" class="title" text-anchor="middle">KOS+LLM-Wiki — 五层知识组织架构图</text>
  <text x="575" y="46" text-anchor="middle" font-size="9" fill="#64748b">Knowledge Organization Systems × LLM-Wiki 编译引擎</text>

  <!-- Left side: data flow arrow -->
  <line x1="38" y1="870" x2="38" y2="100" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow-up)"/>
  <text x="30" y="500" font-size="8" fill="#64748b" text-anchor="middle" transform="rotate(-90,30,500)">数据向上编译 · Data Flow Upward</text>

  <!-- ============================================================ -->
  <!-- LAYER 5: 知识图谱层                                          -->
  <!-- ============================================================ -->
  <rect x="55" y="70" width="1060" height="145" rx="10" fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="55" y="70" width="220" height="22" rx="6" fill="rgba(30,41,59,0.5)"/>
  <text x="67" y="85" class="layer-label" fill="#94a3b8">Layer 5: 知识图谱层 Knowledge Graph</text>
  <text x="1065" y="85" font-size="8" fill="#64748b" text-anchor="end">人类维护</text>

  <!-- KG nodes: Concepts ↔ Entities ↔ Sources -->
  <rect x="165" y="110" width="220" height="55" rx="6" fill="#0f172a"/>
  <rect x="165" y="110" width="220" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="275" y="132" class="comp-title" text-anchor="middle">🧠 Concepts 概念</text>
  <text x="275" y="148" class="comp-sub" text-anchor="middle">wiki/concepts/ · N 节点</text>

  <path d="M 385 137 L 420 137" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-right)"/>
  <text x="402" y="132" font-size="7" fill="#64748b" text-anchor="middle">↔</text>

  <rect x="430" y="110" width="220" height="55" rx="6" fill="#0f172a"/>
  <rect x="430" y="110" width="220" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="540" y="132" class="comp-title" text-anchor="middle">👤 Entities 实体</text>
  <text x="540" y="148" class="comp-sub" text-anchor="middle">wiki/entities/ · M 节点</text>

  <path d="M 650 137 L 685 137" fill="none" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-right)"/>
  <text x="667" y="132" font-size="7" fill="#64748b" text-anchor="middle">↔</text>

  <rect x="695" y="110" width="220" height="55" rx="6" fill="#0f172a"/>
  <rect x="695" y="110" width="220" height="55" rx="6" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="805" y="132" class="comp-title" text-anchor="middle">📄 Sources 来源</text>
  <text x="805" y="148" class="comp-sub" text-anchor="middle">wiki/sources/ · K 节点</text>

  <!-- Cross-Library hub -->
  <rect x="430" y="178" width="220" height="25" rx="4" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="0.8"/>
  <text x="540" y="195" font-size="9" font-weight="500" fill="#fb923c" text-anchor="middle">🔗 跨库关联 Cross-Library · META-INDEX</text>

  <line x1="385" y1="137" x2="430" y2="190" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="650" y1="137" x2="540" y2="190" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="805" y1="165" x2="650" y2="190" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- Layer 5→4 Arrow -->
  <path d="M 585 215 L 585 238" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- ============================================================ -->
  <!-- LAYER 4: 本体层                                              -->
  <!-- ============================================================ -->
  <rect x="55" y="245" width="1060" height="135" rx="10" fill="none" stroke="#a78bfa" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="55" y="245" width="220" height="22" rx="6" fill="rgba(76,29,149,0.3)"/>
  <text x="67" y="260" class="layer-label" fill="#a78bfa">Layer 4: 本体层 Ontology — OWL/RDF</text>
  <text x="1065" y="260" font-size="8" fill="#64748b" text-anchor="end">AI 编译</text>

  <!-- C→C -->
  <rect x="80" y="285" width="300" height="80" rx="6" fill="#0f172a"/>
  <rect x="80" y="285" width="300" height="80" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="230" y="305" class="comp-title" text-anchor="middle">概念 → 概念 (C→C)</text>
  <text x="230" y="320" class="comp-sub" text-anchor="middle">子类型 / 组成 / 关联 / 前置</text>
  <text x="230" y="338" class="rel-text" text-anchor="middle">is-a · part-of · related · precedes</text>
  <text x="230" y="352" class="comp-sub" text-anchor="middle">如: RAG `is-a` Information-Retrieval</text>

  <!-- C→E -->
  <rect x="405" y="285" width="300" height="80" rx="6" fill="#0f172a"/>
  <rect x="405" y="285" width="300" height="80" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="555" y="305" class="comp-title" text-anchor="middle">概念 → 实体 (C→E)</text>
  <text x="555" y="320" class="comp-sub" text-anchor="middle">实现 / 使用 / 例证</text>
  <text x="555" y="338" class="rel-text" text-anchor="middle">implements · uses · exemplifies</text>
  <text x="555" y="352" class="comp-sub" text-anchor="middle">如: Obsidian `implements` PKM</text>

  <!-- E→E -->
  <rect x="730" y="285" width="300" height="80" rx="6" fill="#0f172a"/>
  <rect x="730" y="285" width="300" height="80" rx="6" fill="rgba(76,29,149,0.15)" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="880" y="305" class="comp-title" text-anchor="middle">实体 → 实体 (E→E)</text>
  <text x="880" y="320" class="comp-sub" text-anchor="middle">创建 / 协作 / 竞争 / 演化</text>
  <text x="880" y="338" class="rel-text" text-anchor="middle">created · collaborates · competes</text>
  <text x="880" y="352" class="comp-sub" text-anchor="middle">如: Otlet `created` UDC</text>

  <!-- Layer 4→3 Arrow -->
  <path d="M 585 380 L 585 398" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- ============================================================ -->
  <!-- LAYER 3: 叙词表层                                            -->
  <!-- ============================================================ -->
  <rect x="55" y="405" width="1060" height="125" rx="10" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="55" y="405" width="260" height="22" rx="6" fill="rgba(120,53,15,0.3)"/>
  <text x="67" y="420" class="layer-label" fill="#fbbf24">Layer 3: 叙词表层 Thesaurus — ISO 25964 / SKOS</text>
  <text x="1065" y="420" font-size="8" fill="#64748b" text-anchor="end">AI 编译</text>

  <!-- EQ -->
  <rect x="100" y="440" width="280" height="70" rx="6" fill="#0f172a"/>
  <rect x="100" y="440" width="280" height="70" rx="6" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="240" y="460" class="comp-title" text-anchor="middle">EQ 等同关系</text>
  <text x="240" y="478" class="comp-sub" text-anchor="middle">优选词 ↔ 非优选词</text>
  <text x="240" y="495" class="comp-sub" text-anchor="middle">aliases[0] 为首选 · aliases[1:] 为非首选</text>

  <!-- BT/NT -->
  <rect x="415" y="440" width="280" height="70" rx="6" fill="#0f172a"/>
  <rect x="415" y="440" width="280" height="70" rx="6" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="555" y="460" class="comp-title" text-anchor="middle">BT/NT 层级关系</text>
  <text x="555" y="478" class="comp-sub" text-anchor="middle">Broader Term / Narrower Term</text>
  <text x="555" y="495" class="comp-sub" text-anchor="middle">[[broader]] — broader · [[narrower]] — narrower</text>

  <!-- RT -->
  <rect x="730" y="440" width="280" height="70" rx="6" fill="#0f172a"/>
  <rect x="730" y="440" width="280" height="70" rx="6" fill="rgba(120,53,15,0.15)" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="870" y="460" class="comp-title" text-anchor="middle">RT 关联关系</text>
  <text x="870" y="478" class="comp-sub" text-anchor="middle">Related Term</text>
  <text x="870" y="495" class="comp-sub" text-anchor="middle">[[related]] — related</text>

  <!-- Layer 3→2 Arrow -->
  <path d="M 585 530 L 585 548" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- ============================================================ -->
  <!-- LAYER 2: 分类法层                                            -->
  <!-- ============================================================ -->
  <rect x="55" y="555" width="1060" height="135" rx="10" fill="none" stroke="#34d399" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="55" y="555" width="265" height="22" rx="6" fill="rgba(6,78,59,0.3)"/>
  <text x="67" y="570" class="layer-label" fill="#34d399">Layer 2: 分类法层 Classification — DDC·UDC·CLC·LCC</text>

  <!-- DDC -->
  <rect x="70" y="595" width="235" height="80" rx="6" fill="#0f172a"/>
  <rect x="70" y="595" width="235" height="80" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1.2"/>
  <text x="187" y="618" class="comp-title" text-anchor="middle">📚 DDC 杜威</text>
  <text x="187" y="635" class="comp-sub" text-anchor="middle">子库骨架 · #ddc/ 标签</text>
  <text x="187" y="652" class="comp-sub" text-anchor="middle">子库组织 · 层级枚举</text>
  <text x="187" y="666" class="comp-sub" text-anchor="middle">ddc: "XXX" 字段</text>

  <!-- ↔ arrow between DDC and UDC -->
  <rect x="310" y="622" width="40" height="24" rx="4" fill="rgba(251,146,60,0.15)" stroke="#fb923c" stroke-width="0.8"/>
  <text x="330" y="638" font-size="7" fill="#fb923c" text-anchor="middle">⇄</text>

  <!-- UDC -->
  <rect x="355" y="595" width="235" height="80" rx="6" fill="#0f172a"/>
  <rect x="355" y="595" width="235" height="80" rx="6" fill="rgba(6,78,59,0.2)" stroke="#34d399" stroke-width="1.2"/>
  <text x="472" y="618" class="comp-title" text-anchor="middle">🔗 UDC 国际</text>
  <text x="472" y="635" class="comp-sub" text-anchor="middle">分面标引 · #udc/ 标签</text>
  <text x="472" y="652" class="comp-sub" text-anchor="middle">分面组合 · `:` 复合号</text>
  <text x="472" y="666" class="comp-sub" text-anchor="middle">udc: "XXX" 字段</text>

  <!-- CLC -->
  <rect x="640" y="595" width="215" height="80" rx="6" fill="#0f172a"/>
  <rect x="640" y="595" width="215" height="80" rx="6" fill="rgba(59,130,246,0.15)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="747" y="618" class="comp-title" text-anchor="middle">📖 CLC 中图</text>
  <text x="747" y="635" class="comp-sub" text-anchor="middle">中国图书馆分类法</text>
  <text x="747" y="652" class="comp-sub" text-anchor="middle">中文兼容映射</text>
  <text x="747" y="666" class="comp-sub" text-anchor="middle">clc: "TP18" 字段</text>

  <!-- LCC -->
  <rect x="880" y="595" width="215" height="80" rx="6" fill="#0f172a"/>
  <rect x="880" y="595" width="215" height="80" rx="6" fill="rgba(59,130,246,0.15)" stroke="#60a5fa" stroke-width="1.2"/>
  <text x="987" y="618" class="comp-title" text-anchor="middle">🌐 LCC 国会</text>
  <text x="987" y="635" class="comp-sub" text-anchor="middle">美国国会分类法</text>
  <text x="987" y="652" class="comp-sub" text-anchor="middle">学术标准映射</text>
  <text x="987" y="666" class="comp-sub" text-anchor="middle">lcc: "Q335" 字段</text>

  <!-- "双标签体系" annotation -->
  <rect x="298" y="678" width="68" height="18" rx="9" fill="rgba(251,146,60,0.2)" stroke="#fb923c" stroke-width="0.6"/>
  <text x="332" y="691" font-size="7" fill="#fb923c" text-anchor="middle">双标签体系</text>

  <!-- Layer 2→1 Arrow -->
  <path d="M 585 690 L 585 708" fill="none" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-up)"/>

  <!-- ============================================================ -->
  <!-- LAYER 1: 元数据层                                            -->
  <!-- ============================================================ -->
  <rect x="55" y="715" width="1060" height="135" rx="10" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
  <rect x="55" y="715" width="250" height="22" rx="6" fill="rgba(8,51,68,0.4)"/>
  <text x="67" y="730" class="layer-label" fill="#22d3ee">Layer 1: 元数据层 Metadata — Dublin Core</text>
  <text x="1065" y="730" font-size="8" fill="#64748b" text-anchor="end">人类维护</text>

  <!-- Dublin Core box -->
  <rect x="80" y="750" width="1010" height="85" rx="6" fill="#0f172a"/>
  <rect x="80" y="750" width="1010" height="85" rx="6" fill="rgba(8,51,68,0.15)" stroke="#22d3ee" stroke-width="1.2"/>

  <text x="585" y="770" class="comp-title" text-anchor="middle">Dublin Core 15 核心元素 → Frontmatter 映射</text>

  <!-- Mapping columns -->
  <rect x="100" y="782" width="145" height="20" rx="4" fill="rgba(8,51,68,0.3)"/>
  <text x="172" y="796" class="badge" fill="#22d3ee" text-anchor="middle">dc:title → aliases</text>

  <rect x="260" y="782" width="145" height="20" rx="4" fill="rgba(8,51,68,0.3)"/>
  <text x="332" y="796" class="badge" fill="#22d3ee" text-anchor="middle">dc:date → created</text>

  <rect x="420" y="782" width="145" height="20" rx="4" fill="rgba(8,51,68,0.3)"/>
  <text x="492" y="796" class="badge" fill="#22d3ee" text-anchor="middle">dc:type → type</text>

  <rect x="580" y="782" width="145" height="20" rx="4" fill="rgba(8,51,68,0.3)"/>
  <text x="652" y="796" class="badge" fill="#22d3ee" text-anchor="middle">dc:subject → topic</text>

  <rect x="740" y="782" width="145" height="20" rx="4" fill="rgba(8,51,68,0.3)"/>
  <text x="812" y="796" class="badge" fill="#22d3ee" text-anchor="middle">dc:identifier → ddc+udc</text>

  <text x="585" y="825" class="comp-sub" text-anchor="middle">source → sources[] · language → zh (隐含) · relation → parent + [[]] · coverage → udc-aux</text>

  <!-- ============================================================ -->
  <!-- STANDARDS BAR                                                -->
  <!-- ============================================================ -->
  <rect x="55" y="875" width="1060" height="45" rx="8" fill="none" stroke="#64748b" stroke-width="0.8" stroke-dasharray="4,4"/>
  <rect x="55" y="875" width="180" height="45" rx="8" fill="rgba(30,41,59,0.4)"/>
  <text x="67" y="902" font-size="10" font-weight="600" fill="#94a3b8">采用标准 Standards</text>

  <rect x="245" y="886" width="115" height="24" rx="12" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="302" y="902" font-size="9" fill="#fbbf24" text-anchor="middle">ISO 25964 叙词表</text>

  <rect x="370" y="886" width="120" height="24" rx="12" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="430" y="902" font-size="9" fill="#a78bfa" text-anchor="middle">ISO 13250 主题图</text>

  <rect x="500" y="886" width="100" height="24" rx="12" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="550" y="902" font-size="9" fill="#a78bfa" text-anchor="middle">XTM XML 语法</text>

  <rect x="610" y="886" width="80" height="24" rx="12" fill="rgba(120,53,15,0.2)" stroke="#fbbf24" stroke-width="0.6"/>
  <text x="650" y="902" font-size="9" fill="#fbbf24" text-anchor="middle">SKOS 叙词表</text>

  <rect x="700" y="886" width="80" height="24" rx="12" fill="rgba(76,29,149,0.2)" stroke="#a78bfa" stroke-width="0.6"/>
  <text x="740" y="902" font-size="9" fill="#a78bfa" text-anchor="middle">OWL 本体</text>

  <rect x="790" y="886" width="100" height="24" rx="12" fill="rgba(8,51,68,0.3)" stroke="#22d3ee" stroke-width="0.6"/>
  <text x="840" y="902" font-size="9" fill="#22d3ee" text-anchor="middle">Dublin Core</text>

  <!-- ============================================================ -->
  <!-- LEGEND                                                       -->
  <!-- ============================================================ -->
  <rect x="55" y="940" width="1060" height="25" rx="6" fill="rgba(30,41,59,0.3)"/>

  <rect x="70" y="944" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="86" y="955" font-size="8" fill="#22d3ee">Layer 1 元数据</text>

  <rect x="170" y="944" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="186" y="955" font-size="8" fill="#34d399">Layer 2 分类法</text>

  <rect x="275" y="944" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="291" y="955" font-size="8" fill="#fbbf24">Layer 3 叙词表</text>

  <rect x="375" y="944" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="391" y="955" font-size="8" fill="#a78bfa">Layer 4 本体</text>

  <rect x="460" y="944" width="12" height="12" rx="2" fill="rgba(30,41,59,0.5)" stroke="#94a3b8" stroke-width="1"/>
  <text x="476" y="955" font-size="8" fill="#94a3b8">Layer 5 知识图谱</text>

  <text x="575" y="955" font-size="8" fill="#64748b" text-anchor="middle">数据向上编译 · 从元数据到知识图谱</text>

  <text x="930" y="955" font-size="8" fill="#64748b" text-anchor="middle">DDC 025.4 · UDC 025.4 · KOS+LLM-Wiki v1.0</text>
</svg>